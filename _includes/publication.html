{% assign paper = include.paper %}
<article class="publication">
  <div class="publication__venue">{{ paper.venue | escape }}</div>
  <h3 class="publication__title">{{ paper.title | escape }}</h3>
  <p class="publication__authors">{% for author in paper.authors %}{% if author == "Wenxiao Zhao" %}<strong>{{ author | escape }}</strong>{% else %}{{ author | escape }}{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
</article>
